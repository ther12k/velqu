name: perf-gate

# #1319 / M6-009: merge-blocking performance gates, deliberately SEPARATE
# from the functional `verify` lane. Two gates:
#   1. cold-start-regression — boot-to-ready p50/p95 against committed
#      bounds (benchmarks/gate-thresholds.json). Loose bounds catch
#      catastrophic startup collapses; tightening is an owner benchmark
#      decision (constraint 12).
# Runs on runtime-affecting paths, weekly, and on demand. Not part of
# scripts/verify: timing gates in per-PR verify would flake on shared
# runners; a bound this loose still trips on real collapses.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1" # weekly, Monday 04:00 UTC
  pull_request:
    paths:
      - "crates/q-runtime/**"
      - "crates/q-engine/**"
      - "crates/q-engine-quickjs/**"
      - "crates/q-http/**"
      - "crates/q-bridge/**"
      - "crates/q-router/**"
      - "crates/q-pack/**"
      - ".github/workflows/perf-gate.yml"

jobs:
  cold-start:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (pinned)
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: perf-gate-x86_64-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build release runtime
        run: cargo build --release -p velqu-runtime
      - name: Cold-start regression gate
        run: bun scripts/cold-start-gate.ts --samples 20
