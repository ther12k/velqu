name: perf-gate

# #1319 / M6-009: merge-blocking performance gates, deliberately SEPARATE
# from the functional `verify` lane. Two real gates:
#   1. cold-start — boot-to-ready p50/p95 against committed bounds.
#   2. throughput-latency — warm throughput (min rps) & latency (max p50/p95/p99)
#      across C0 (static liveness), C1 (text), C2 (JSON), and C3 (validated path).
# Both gates enforce fail-closed regression checks against benchmarks/gate-thresholds.json.
#
# MERGE-ENFORCEMENT CONTRACT: the workflow triggers on EVERY pull request
# (no workflow-level path filter — a filtered trigger would never report a
# check for out-of-scope PRs, and a required status check that never reports
# blocks merges forever). Path relevance is decided INSIDE by the `changes`
# job: on runtime-irrelevant PRs the two expensive gate jobs skip, and the
# always-present `perf-gate` aggregate job applies an explicit state machine
# (a broken `changes` classification FAILS the aggregate — it can never
# launder a skip into a pass). Required-check enforcement (owner/admin
# branch ruleset) should therefore pin exactly one check name: `perf-gate`.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1" # weekly, Monday 04:00 UTC
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.filter.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            runtime:
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - "package.json"
              - "bun.lock"
              - "crates/**"
              - "packages/**"
              - "examples/proof/**"
              - "scripts/cold-start-gate.ts"
              - "scripts/throughput-latency-gate.ts"
              - "scripts/throughput-latency-gate.test.ts"
              - "benchmarks/gate-thresholds.json"
              - ".github/workflows/perf-gate.yml"

  cold-start:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (pinned)
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: perf-gate-x86_64-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Build release runtime
        run: cargo build --release -p velqu-runtime
      - name: Cold-start regression gate
        run: bun scripts/cold-start-gate.ts --samples 20

  throughput-latency:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (pinned)
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: perf-gate-x86_64-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Build release runtime
        run: cargo build --release -p velqu-runtime
      - name: Build proof pack
        run: bun packages/cli/src/index.ts build --project examples/proof
      - name: Verify regression-gate behavior (fail-closed test suite)
        run: bun test scripts/throughput-latency-gate.test.ts
      - name: Throughput and latency regression gate
        run: bun scripts/throughput-latency-gate.ts --duration-secs 3 --concurrency 10

  # M6-009 merge enforcement: ALWAYS-present aggregate check, safe to pin as
  # a required status check. Explicit state machine — there is deliberately
  # NO outcome that yields success by accident:
  #   - the `changes` classification itself failed/cancelled → FAIL (a broken
  #     relevance decision must never become a pass)
  #   - runtime-relevant PR  → both real gates must be `success`; any skip = FAIL
  #   - runtime-irrelevant PR → both real gates must be `skipped` → "not applicable"
  #   - schedule/manual run  → both real gates must be `success` (relevance N/A)
  #   - any gate `failure`/`cancelled` anywhere → FAIL
  perf-gate:
    needs: [changes, cold-start, throughput-latency]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate performance-gate verdict
        run: |
          changes="${{ needs.changes.result }}"
          cold="${{ needs.cold-start.result }}"
          tput="${{ needs.throughput-latency.result }}"
          is_pr="${{ github.event_name == 'pull_request' }}"
          runtime="${{ needs.changes.outputs.runtime }}"
          echo "event:            ${{ github.event_name }}"
          echo "changes result:   $changes (runtime=$runtime)"
          echo "cold-start:       $cold"
          echo "throughput:       $tput"
          fail() { echo "::error::perf-gate: $1"; exit 1; }
          # 0. a failed/cancelled real gate is always a failure
          if [[ "$cold" == "failure" || "$tput" == "failure" ]]; then
            fail "a performance gate FAILED (merge blocked pending revert or thresholds decision)"
          fi
          if [[ "$cold" == "cancelled" || "$tput" == "cancelled" ]]; then
            fail "a performance gate was CANCELLED — inconclusive, treated as failure"
          fi
          if [[ "$is_pr" == "true" ]]; then
            # 1. the relevance classification must have succeeded
            if [[ "$changes" != "success" ]]; then
              fail "changes classification is '$changes' (not success) — cannot prove the gates were correctly scheduled; treated as failure"
            fi
            if [[ "$runtime" == "true" ]]; then
              # 2. runtime-relevant PR: both gates MUST have run and passed
              if [[ "$cold" != "success" || "$tput" != "success" ]]; then
                fail "runtime-relevant PR but a gate did not succeed (cold=$cold throughput=$tput) — inconclusive, treated as failure"
              fi
              echo "performance gate OK (runtime-relevant PR; both gates passed)"
            else
              # 3. runtime-irrelevant PR: gates must have been skipped
              if [[ "$cold" != "skipped" || "$tput" != "skipped" ]]; then
                fail "runtime-irrelevant PR but a gate was not skipped (cold=$cold throughput=$tput) — unexpected scheduling; treated as failure"
              fi
              echo "performance gate OK (not applicable to this change's paths; both gates skipped as designed)"
            fi
          else
            # 4. schedule/manual: gates run unconditionally and must pass
            if [[ "$cold" != "success" || "$tput" != "success" ]]; then
              fail "scheduled/manual run requires both gates to succeed (cold=$cold throughput=$tput)"
            fi
            echo "performance gate OK (scheduled/manual run; both gates passed)"
          fi
