# M28-002-A spike: standalone, intentionally NOT part of the Velqu workspace.
[workspace]

[package]
name = "spike-reqwest"
version = "0.1.0"
edition = "2021"

# Policy-shaped features: rustls + webpki roots only, no default TLS,
# no ambient gzip/brotli/zstd/deflate, no cookies, no SOCKS, no h2.
[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
