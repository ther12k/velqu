[package]
name = "q-bench-support"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "q-bridge-bench"
path = "src/bin/bridge_bench.rs"

[[bin]]
name = "metrics-overhead"
path = "src/bin/metrics_overhead.rs"

[[bin]]
name = "q-codec-bench"
path = "src/bin/codec_bench/main.rs"

[[bin]]
name = "q-worker-scaling"
path = "src/bin/worker_scaling.rs"

[[bin]]
name = "q-soak"
path = "src/bin/soak.rs"

[features]
bench-instrumentation = ["q-engine-quickjs/bench-instrumentation"]

[dependencies]
q-capabilities = { workspace = true }
q-engine = { workspace = true }
q-engine-quickjs = { workspace = true }
q-bridge = { workspace = true }
q-schema-runtime = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
sha2 = { workspace = true }
libc = "0.2"
