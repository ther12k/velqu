[package]
name = "q-capability-postgres"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio = { workspace = true }
tokio-postgres = { version = "0.7", features = ["runtime"] }
serde_json = { workspace = true }
# #1425: StreamExt over tokio-postgres's RowStream for budgeted streaming
# result collection (version pinned by the workspace lockfile).
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
q-capabilities = { workspace = true }
log = "0.4"
