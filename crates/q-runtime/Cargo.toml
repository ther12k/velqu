[package]
name = "velqu-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "velqu-runtime"
path = "src/main.rs"

[lib]
name = "velqu_runtime"
path = "src/lib.rs"

# M26-009-B: standalone mode. The pack is embedded at compile time via
# VELQU_STANDALONE_PACK; the bin is skipped unless the feature is enabled
# so ordinary builds never need the variable.
[[bin]]
name = "velqu-standalone"
path = "src/bin/velqu-standalone.rs"
required-features = ["standalone"]

[features]
standalone = []

[dependencies]
q-pack = { workspace = true }
q-router = { workspace = true }
q-bridge = { workspace = true }
q-capabilities = { workspace = true }
q-engine = { workspace = true }
q-engine-quickjs = { workspace = true }
q-http = { workspace = true }
q-schema-runtime = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
clap = { workspace = true }
sourcemap = { workspace = true }
bytes = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
hyper-rustls = { workspace = true }
http-body-util = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
rquickjs = { workspace = true }
sourcemap = { workspace = true }
libc = "0.2"
