[package]
name = "q-bytecode-tool"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "velqu-bytecode"
path = "src/main.rs"

[dependencies]
q-pack  = { path = "../q-pack" }
q-engine-quickjs = { path = "../q-engine-quickjs" }
rquickjs = { version = "=0.12.2", features = ["full-async"] }
sha2    = "0.10"
serde_json = "1"
